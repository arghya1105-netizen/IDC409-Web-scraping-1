
name: Validate project files

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m compileall -q "Data collection"
      - name: Validate notebook JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          notebooks = list(Path(".").rglob("*.ipynb"))
          if not notebooks:
              raise SystemExit("No notebooks found")
          for path in notebooks:
              with path.open(encoding="utf-8") as handle:
                  notebook = json.load(handle)
              if "cells" not in notebook or "nbformat" not in notebook:
                  raise SystemExit(f"Invalid notebook structure: {path}")
              print(f"Validated {path}")
          PY
